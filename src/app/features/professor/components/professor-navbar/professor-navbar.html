<aside class="flex h-full w-[240px] shrink-0 flex-col border-r border-table bg-surface shadow-md">
  <!-- LOGO -->
  <div class="flex h-[130px] shrink-0 flex-col justify-center px-5">
    <img src="/assets/images/cps/logo_cps_versao_cor.png" alt="Centro Paula Souza"
      class="h-auto w-[82px] object-contain" />

    <span class="mt-3 text-[11px] font-bold uppercase tracking-wide text-text">
      Central do Professor
    </span>
  </div>

  <!-- NAVEGAÇÃO -->
  <nav class="flex flex-col" aria-label="Professor navigation">
    <!-- PROFILE -->
    <a routerLink="/professor/profile"
      class="flex h-11 items-center justify-between border-r-4 px-5 text-sm transition-colors"
      [class.border-secondary]="activeItem() === 'profile'" [class.bg-table]="activeItem() === 'profile'"
      [class.font-bold]="activeItem() === 'profile'" [class.text-secondary]="activeItem() === 'profile'"
      [class.border-transparent]="activeItem() !== 'profile'" [class.text-text]="activeItem() !== 'profile'"
      [class.hover:bg-background]="activeItem() !== 'profile'" [class.hover:text-primary]="activeItem() !== 'profile'">
      <span>Perfil</span>

      <svg lucideUserRound [size]="18" [strokeWidth]="2" aria-hidden="true"></svg>
    </a>

    <!-- AVAILABILITY -->
    <a routerLink="/professor/availability"
      class="flex h-11 items-center justify-between border-r-4 px-5 text-sm transition-colors"
      [class.border-secondary]="activeItem() === 'availability'" [class.bg-table]="activeItem() === 'availability'"
      [class.font-bold]="activeItem() === 'availability'" [class.text-secondary]="activeItem() === 'availability'"
      [class.border-transparent]="activeItem() !== 'availability'" [class.text-text]="activeItem() !== 'availability'"
      [class.hover:bg-background]="activeItem() !== 'availability'"
      [class.hover:text-primary]="activeItem() !== 'availability'">
      <span>Disponibilidade</span>

      <svg lucideCalendarDays [size]="18" [strokeWidth]="1.8" aria-hidden="true"></svg>
    </a>
  </nav>

  <!-- LOGOUT -->
  <div class="mt-auto">
    <button type="button"
      class="flex h-11 w-full items-center justify-between px-5 text-left text-sm text-text transition-colors hover:bg-background hover:text-primary"
      (click)="logout()">
      <span>Sair</span>

      <svg lucideLogOut [size]="18" [strokeWidth]="1.8" aria-hidden="true"></svg>
    </button>
  </div>
</aside>
