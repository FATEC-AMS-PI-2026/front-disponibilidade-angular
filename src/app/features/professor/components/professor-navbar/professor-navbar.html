<aside class="flex h-full w-[208px] shrink-0 flex-col border-r border-slate-300 bg-white shadow-md">
  <!-- IDENTIDADE -->
  <div class="flex h-[130px] shrink-0 flex-col justify-center px-4">
    <img src="/assets/images/cps/logo_cps_versao_cor.png" alt="Centro Paula Souza"
      class="h-auto w-[76px] object-contain" />

    <span class="mt-3 text-[11px] font-bold uppercase text-slate-600">
      Central do professor
    </span>
  </div>

  <!-- NAVEGAÇÃO -->
  <nav class="flex flex-col" aria-label="Navegação do professor">
    <button type="button"
      class="flex h-10 w-full items-center justify-between border-r-4 px-4 text-left text-sm transition-colors"
      [class.border-red-600]="activeItem() === 'perfil'" [class.bg-slate-200]="activeItem() === 'perfil'"
      [class.font-bold]="activeItem() === 'perfil'" [class.text-red-700]="activeItem() === 'perfil'"
      [class.border-transparent]="activeItem() !== 'perfil'" [class.text-slate-600]="activeItem() !== 'perfil'"
      [class.hover:bg-slate-100]="activeItem() !== 'perfil'" [class.hover:text-slate-800]="activeItem() !== 'perfil'"
      (click)="profileClick.emit()">
      <span>Perfil</span>

      <svg lucideUserRound [size]="17" [strokeWidth]="2" aria-hidden="true"></svg>
    </button>

    <button type="button"
      class="flex h-10 w-full items-center justify-between border-r-4 px-4 text-left text-sm transition-colors"
      [class.border-red-600]="activeItem() === 'disponibilidade'"
      [class.bg-slate-200]="activeItem() === 'disponibilidade'" [class.font-bold]="activeItem() === 'disponibilidade'"
      [class.text-red-700]="activeItem() === 'disponibilidade'"
      [class.border-transparent]="activeItem() !== 'disponibilidade'"
      [class.text-slate-600]="activeItem() !== 'disponibilidade'"
      [class.hover:bg-slate-100]="activeItem() !== 'disponibilidade'"
      [class.hover:text-slate-800]="activeItem() !== 'disponibilidade'" (click)="availabilityClick.emit()">
      <span>Disponibilidade</span>

      <svg lucideCalendarDays [size]="17" [strokeWidth]="1.8" aria-hidden="true"></svg>
    </button>
  </nav>

  <!-- AÇÕES -->
  <div class="mt-auto">
    <button type="button"
      class="flex h-10 w-full items-center justify-between px-4 text-left text-sm text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-800"
      (click)="logoutClick.emit()">
      <span>Sair</span>

      <svg lucideLogOut [size]="17" [strokeWidth]="1.8" aria-hidden="true"></svg>
    </button>
  </div>
</aside>
