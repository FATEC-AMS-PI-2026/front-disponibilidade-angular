<section class="mx-auto flex w-full max-w-[560px] justify-center">
  <div class="mx-auto w-full max-w-[400px] rounded-[8px] border-l-4 border-cyan-700 bg-white p-6 shadow-2xl">

    <div class="mb-6 flex items-start justify-between gap-4">
      <div class="flex flex-col gap-2">

        <div class="flex items-center gap-2 text-cyan-800">
          <svg
            lucideKeyRound
            width="20"
            height="20"
            stroke-width="2"
            aria-hidden="true"
          ></svg>

          <span class="text-xs font-bold uppercase tracking-wide">
            Acesso administrativo
          </span>
        </div>

        <h1 class="text-xl font-bold uppercase tracking-tight text-slate-800">
          Bem-vindo!
        </h1>

        <p class="text-[10px] uppercase leading-relaxed text-slate-500">
          Entre com suas credenciais para acessar o ambiente de gestão.
        </p>

      </div>

      <button
        type="button"
        aria-label="Voltar para seleção de acesso"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[8px] text-slate-500 transition hover:bg-slate-100 hover:text-cyan-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-600"
        (click)="goBack()"
      >
        <svg
          lucideArrowLeft
          width="18"
          height="18"
          stroke-width="2"
          aria-hidden="true"
        ></svg>
      </button>
    </div>

    <form
      class="flex flex-col gap-4"
      (ngSubmit)="submit()"
    >
      <div class="flex flex-col gap-2">
        <label
          for="coordinator-email"
          class="text-[10px] font-bold uppercase tracking-wide text-slate-600"
        >
          Login
        </label>

        <div class="relative">
          <svg
            lucideMail
            width="16"
            height="16"
            stroke-width="1.8"
            aria-hidden="true"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
          ></svg>

          <input
            id="coordinator-email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="seu.email@fatec.sp.gov.br"
            [(ngModel)]="email"
            required
            class="h-10 w-full rounded-[8px] border border-slate-300 pl-10 pr-3 text-xs text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-cyan-700 focus:ring-2 focus:ring-cyan-100"
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label
          for="coordinator-password"
          class="text-[10px] font-bold uppercase tracking-wide text-slate-600"
        >
          Senha
        </label>

        <div class="relative">
          <svg
            lucideLockKeyhole
            width="16"
            height="16"
            stroke-width="1.8"
            aria-hidden="true"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
          ></svg>

          <input
            id="coordinator-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            [(ngModel)]="password"
            required
            class="h-10 w-full rounded-[8px] border border-slate-300 px-10 text-xs text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-cyan-700 focus:ring-2 focus:ring-cyan-100"
          />

          <button
            type="button"
            [attr.aria-label]="
              showPassword() ? 'Ocultar senha' : 'Mostrar senha'
            "
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 transition hover:text-cyan-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-600"
            (click)="togglePasswordVisibility()"
          >
            @if (showPassword()) {
              <svg
                lucideEyeOff
                width="16"
                height="16"
                stroke-width="1.8"
                aria-hidden="true"
              ></svg>
            } @else {
              <svg
                lucideEye
                width="16"
                height="16"
                stroke-width="1.8"
                aria-hidden="true"
              ></svg>
            }
          </button>
        </div>
      </div>

      <label class="flex cursor-pointer items-center gap-2 text-[10px] text-slate-500">
        <input
          type="checkbox"
          name="rememberAccess"
          [(ngModel)]="rememberAccess"
          class="h-3.5 w-3.5 rounded-[8px] border-slate-300 text-cyan-700 focus:ring-cyan-200"
        />

        <span>Continuar conectado</span>
      </label>

      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="flex h-10 items-center justify-center gap-2 rounded-[8px] bg-cyan-800 px-4 text-[10px] font-bold uppercase tracking-wide text-white shadow-md transition hover:bg-cyan-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-500 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isSubmitting()) {
          Entrando...
        } @else {
          Entrar
        }
      </button>
    </form>

    <a
      routerLink="/recuperar-senha"
      class="mt-4 inline-block text-[10px] font-medium text-cyan-800 transition hover:text-cyan-950 hover:underline"
    >
      Esqueci a senha
    </a>

  </div>
</section>
