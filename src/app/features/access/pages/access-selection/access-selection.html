<section class="mx-auto flex w-full max-w-[672px] justify-center px-4">
  <div class="w-full rounded-[8px] border-l-4 border-cyan-700 bg-white p-6 shadow-2xl">

    <div class="mb-6">
      <h1 class="text-xl font-bold uppercase tracking-tight text-slate-800">
        Como deseja acessar?
      </h1>

      <p class="mt-2 text-[10px] uppercase leading-relaxed text-slate-500">
        Selecione seu perfil de trabalho
      </p>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

      <button type="button"
        class="flex min-h-28 items-center gap-4 rounded-[8px] bg-cyan-800 p-4 text-left text-white shadow-md transition duration-150 ease-in-out hover:-translate-y-0.5 hover:bg-cyan-900 hover:shadow-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-500"
        (click)="accessAsProfessor()">
        <svg lucideGraduationCap width="24" height="24" stroke-width="1.8" aria-hidden="true"
          class="block shrink-0"></svg>

        <span class="flex flex-col gap-2">
          <span class="text-base font-bold uppercase">
            Professor
          </span>

          <span class="text-[9px] uppercase tracking-[0.025em] text-white/80">
            Ambiente docente
          </span>
        </span>
      </button>

      <button type="button"
        class="flex min-h-28 items-center gap-4 rounded-[8px] bg-cyan-800 p-4 text-left text-white shadow-md transition duration-150 ease-in-out hover:-translate-y-0.5 hover:bg-cyan-900 hover:shadow-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-500"
        (click)="accessAsCoordinator()">
        <svg lucideSettings2 width="24" height="24" stroke-width="1.8" aria-hidden="true" class="block shrink-0"></svg>

        <span class="flex flex-col gap-2">
          <span class="text-base font-bold uppercase">
            Coordenador
          </span>

          <span class="text-[9px] uppercase tracking-[0.025em] text-white/80">
            Ambiente de gestão
          </span>
        </span>
      </button>

    </div>
  </div>
</section>
