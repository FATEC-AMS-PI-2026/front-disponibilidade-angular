<section class="mx-auto flex w-full max-w-[560px] justify-center">
  <div class="mx-auto w-full max-w-[400px] rounded-lg border-l-4 border-primary bg-surface p-6 shadow-2xl">

    <div class="mb-6 flex items-start justify-between gap-4">
      <div class="flex flex-col gap-2">

        <div class="flex items-center gap-2 text-primary">
          <svg lucideKeyRound width="20" height="20" stroke-width="2" aria-hidden="true"></svg>

          <span class="text-xs font-bold uppercase tracking-wide">
            Acesso docente
          </span>
        </div>

        <h1 class="text-xl font-bold uppercase tracking-tight text-text">
          Bem-vindo!
        </h1>

        <p class="text-[10px] uppercase leading-relaxed text-text">
          Entre com suas credenciais para acessar o ambiente do professor.
        </p>

      </div>

      <button type="button" aria-label="Voltar para seleção de acesso"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-text transition hover:bg-table hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="goBack()">
        <svg lucideArrowLeft width="18" height="18" stroke-width="2" aria-hidden="true"></svg>
      </button>
    </div>

    <form class="flex flex-col gap-4" (ngSubmit)="submit()">
      <div class="flex flex-col gap-2">
        <label for="professor-email" class="text-[10px] font-bold uppercase tracking-wide text-text">
          Login
        </label>

        <div class="relative">
          <svg lucideMail width="16" height="16" stroke-width="1.8" aria-hidden="true"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text/60"></svg>

          <input id="professor-email" name="email" type="email" autocomplete="username"
            placeholder="seu.email@fatec.sp.gov.br" [(ngModel)]="email" required
            class="h-10 w-full rounded-lg border border-table bg-surface pl-10 pr-3 text-xs text-text outline-none transition placeholder:text-text/60 focus:border-primary focus:ring-2 focus:ring-primary/20" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label for="professor-password" class="text-[10px] font-bold uppercase tracking-wide text-text">
          Senha
        </label>

        <div class="relative">
          <svg lucideLockKeyhole width="16" height="16" stroke-width="1.8" aria-hidden="true"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text/60"></svg>

          <input id="professor-password" name="password" [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password" placeholder="Digite sua senha" [(ngModel)]="password" required
            class="h-10 w-full rounded-lg border border-table bg-surface px-10 text-xs text-text outline-none transition placeholder:text-text/60 focus:border-primary focus:ring-2 focus:ring-primary/20" />

          <button type="button" [attr.aria-label]="
              showPassword() ? 'Ocultar senha' : 'Mostrar senha'
            "
            class="absolute right-3 top-1/2 -translate-y-1/2 text-text/60 transition hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            (click)="togglePasswordVisibility()">
            @if (showPassword()) {
            <svg lucideEyeOff width="16" height="16" stroke-width="1.8" aria-hidden="true"></svg>
            } @else {
            <svg lucideEye width="16" height="16" stroke-width="1.8" aria-hidden="true"></svg>
            }
          </button>
        </div>
      </div>

      <label class="flex cursor-pointer items-center gap-2 text-[10px] text-text">
        <input type="checkbox" name="rememberAccess" [(ngModel)]="rememberAccess"
          class="h-3.5 w-3.5 rounded-lg border-table text-primary focus:ring-primary/20" />

        <span>Continuar conectado</span>
      </label>

      <button type="submit" [disabled]="isSubmitting()"
        class="flex h-10 items-center justify-center gap-2 rounded-lg bg-primary px-4 text-[10px] font-bold uppercase tracking-wide text-white shadow-md transition hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-60">
        @if (isSubmitting()) {
        Entrando...
        } @else {
        Entrar
        }
      </button>
    </form>

    <a routerLink="/recorver-password"
      class="mt-4 inline-block text-[10px] font-medium text-primary transition hover:text-primary/80 hover:underline">
      Esqueci a senha
    </a>

  </div>
</section>
